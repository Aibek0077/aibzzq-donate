
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIBZZQ — Аккаунт</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101510;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 390px;
      padding: 26px;
      border: 1px solid #344334;
      border-radius: 18px;
      background: #1a231a;
    }
    h1 { color: #8be28b; text-align: center; }
    p { color: #c6d2c6; text-align: center; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }
    input {
      border: 1px solid #536353;
      background: #101510;
      color: white;
    }
    button {
      border: 0;
      background: #8be28b;
      color: #102010;
      font-weight: bold;
      cursor: pointer;
    }
    .secondary {
      background: #344334;
      color: white;
    }
    #status { overflow-wrap: anywhere; font-size: 14px; }
    a { color: #8be28b; }
  </style>
</head>
<body>
  <main class="card">
    <h1>AIBZZQ DONATE</h1>
    <p>Аккаунтыңа қош келдің!</p>

    <input id="nickname" placeholder="Ойыншы аты (тіркелгенде)">
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password"
      placeholder="Құпиясөз (кемінде 6 таңба)"
      autocomplete="current-password">

    <button id="register">Тіркелу</button>
    <button id="login" class="secondary">Кіру</button>
    <button id="logout" class="secondary" hidden>Аккаунттан шығу</button>

    <p id="status" role="status">Email мен құпиясөзіңді енгіз.</p>
    <p><a href="index.html">Донат бетіне қайту</a></p>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL =
      'https://wbqusodxzjqywfxhtrmg.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_K_mfCIU3deMxDBPePO24kA_yF10NWVB';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const $ = id => document.getElementById(id);
    const status = $('status');

    function show(message) {
      status.textContent = message;
    }

    $('register').addEventListener('click', async () => {
      const email = $('email').value.trim();
      const password = $('password').value;
      const nickname = $('nickname').value.trim();

      if (!nickname || !email || password.length < 6) {
        show('Ойыншы атын, email мен кемінде 6 таңбалы құпиясөзді енгіз.');
        return;
      }

      show('Тіркеліп жатыр...');
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { nickname },
          emailRedirectTo: location.origin +
            location.pathname.replace(/[^/]*$/, 'auth.html')
        }
      });

      if (error) {
        show('Қате: ' + error.message);
        return;
      }

      if (data.session) {
        show('Тіркелу сәтті өтті!');
      } else {
        show('Поштаңа растау хаты жіберілді. Email-ды тексер.');
      }
    });

    $('login').addEventListener('click', async () => {
      const email = $('email').value.trim();
      const password = $('password').value;

      if (!email || !password) {
        show('Email мен құпиясөзді енгіз.');
        return;
      }

      show('Кіріп жатыр...');
      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        show('Кіру қатесі: ' + error.message);
        return;
      }

      show('Аккаунтыңа сәтті кірдің!');
      await updateAccount();
    });

    async function updateAccount() {
      const { data } = await supabase.auth.getUser();
      const user = data.user;

      if (user) {
        show('Кірдің: ' +
          (user.user_metadata?.nickname || user.email));
        $('logout').hidden = false;
        $('login').hidden = true;
        $('register').hidden = true;
      } else {
        $('logout').hidden = true;
        $('login').hidden = false;
        $('register').hidden = false;
      }
    }

    $('logout').addEventListener('click', async () => {
      const { error } = await supabase.auth.signOut();
      if (error) {
        show('Шығу қатесі: ' + error.message);
        return;
      }
      show('Аккаунттан шықтың.');
      await updateAccount();
    });

    await updateAccount();
  </script>
</body>
</html>
